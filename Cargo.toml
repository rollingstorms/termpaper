[package]
name = "termpaper"
version = "0.1.0"
edition = "2021"
description = "An e-paper-native interactive terminal environment for small Linux computers."
license = "MIT"

[[bin]]
name = "termpaper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
font8x8 = "0.3"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
portable-pty = "0.9"
thiserror = "2.0"
vt100 = "0.16"

[dev-dependencies]
tempfile = "3.20"
